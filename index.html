<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.5/split.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <meta name="description" content="Danh sách ca khám">
    <title>Danh sách ca khám</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="main-page">
        <form  id="loginForm">
            <div class="mb-3 mt-3">
                <label for="Username" class="form-label">Tên đăng nhập:</label>
                <input type="text" class="form-control" id="Username" placeholder="Tên đăng nhập" name="username">
            </div>
            <div class="mb-3">
                <label for="pwd" class="form-label">Mật khẩu:</label>
                <input type="password" class="form-control" id="Password" placeholder="Mật khẩu" name="pswd">
            </div>
            <div id="errorMessage" class="text-danger mb-3" style="display: none;"></div>
            <button type="submit" class="btn btn-primary" id="submitBtn">Đăng nhập</button>
        </form>
    </div>
</body>
</html>
